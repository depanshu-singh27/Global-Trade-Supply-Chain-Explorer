name: Container build

on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - docker-compose.yml
      - .dockerignore
      - renv.lock
      - R/release_*.R
      - R/runtime_*.R
      - scripts/29_*.R
      - scripts/30_*.R
      - scripts/33_*.R
      - scripts/run_phase14_release.R
      - app.R
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: gtsc:phase14-rc
      GTSC_RUNTIME_PROFILE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gdal-bin \
            pandoc \
            pkg-config \
            libabsl-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libglpk-dev \
            libgmp-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            zlib1g-dev

      - name: Install renv and restore (exclude optional Prophet/Stan stack)
        run: |
          Rscript -e "install.packages('renv', repos='https://cloud.r-project.org')"
          Rscript -e "renv::restore(exclude = c('prophet', 'rstan', 'rstantools', 'StanHeaders', 'RcppParallel'), prompt = FALSE)"

      - name: Build demo bundle for image context
        run: Rscript scripts/29_build_demo_bundle.R

      - name: Docker build
        run: docker build --tag "$IMAGE_TAG" .

      - name: Container start and smoke
        run: |
          docker run -d --name gtsc-ci \
            --publish 3838:3838 \
            --env GTSC_RUNTIME_PROFILE=demo \
            --env GTSC_PUBLIC_MODE=true \
            --env GTSC_ALLOW_SCENARIO_WRITES=false \
            --env GTSC_READ_ONLY_MODE=true \
            "$IMAGE_TAG"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3838/__gtsc_health__ | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo HEALTH_OK
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:3838/__gtsc_health__ | tee /tmp/health.json
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3838/ | tee /tmp/root_code.txt
          UID_EFF=$(docker exec gtsc-ci id -u)
          test "$UID_EFF" != "0"
          docker exec gtsc-ci test ! -f /opt/gtsc/app/.Renviron
          docker logs gtsc-ci 2>&1 | tee /tmp/gtsc_logs.txt
          if grep -E 'COMTRADE_PRIMARY\s*=' /tmp/gtsc_logs.txt; then exit 1; fi
          docker stop -t 15 gtsc-ci
          docker rm -f gtsc-ci

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-logs
          path: |
            /tmp/health.json
            /tmp/root_code.txt
            /tmp/gtsc_logs.txt

      - name: Publish image (release tags only)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          echo "Publication placeholder — configure GHCR credentials in Phase 15 before enabling push."
          echo "Refusing unconditional docker push from Phase 14 workflow."
          exit 0

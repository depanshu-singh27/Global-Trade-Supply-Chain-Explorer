name: R tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      GTSC_RUNTIME_PROFILE: demo
      GTSC_PUBLIC_MODE: "true"
      GTSC_ALLOW_SCENARIO_WRITES: "false"
      GTSC_READ_ONLY_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gdal-bin \
            pandoc \
            pkg-config \
            libabsl-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libglpk-dev \
            libgmp-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            zlib1g-dev

      - name: Install renv and restore (exclude optional Prophet/Stan stack)
        run: |
          Rscript -e "install.packages('renv', repos='https://cloud.r-project.org')"
          Rscript -e "renv::restore(exclude = c('prophet', 'rstan', 'rstantools', 'StanHeaders', 'RcppParallel'), prompt = FALSE)"

      - name: Verify mandatory DESCRIPTION Imports
        run: |
          Rscript -e "
            d <- read.dcf('DESCRIPTION')
            imports <- if ('Imports' %in% colnames(d)) d[1, 'Imports'] else ''
            pkgs <- trimws(unlist(strsplit(gsub('[\\r\\n]+', ',', imports), ',', fixed = TRUE)))
            pkgs <- gsub('\\\\s*\\\\(.*\\\\)\\\\s*', '', pkgs)
            pkgs <- pkgs[nzchar(pkgs) & !grepl('^R$', pkgs)]
            missing <- pkgs[!vapply(pkgs, requireNamespace, quietly = TRUE, FUN.VALUE = logical(1))]
            if (length(missing)) {
              stop('Missing mandatory Imports: ', paste(missing, collapse = ', '), call. = FALSE)
            }
            optional <- c('prophet', 'rstan', 'rstantools', 'StanHeaders', 'RcppParallel')
            message('MANDATORY_OK=', length(pkgs))
            message('OPTIONAL_EXCLUDED=', paste(optional, collapse = ','))
          "

      - name: Build and validate demo bundle
        run: |
          Rscript scripts/29_build_demo_bundle.R
          GTSC_RELEASE_PROFILE=demo Rscript scripts/31_validate_release_bundle.R data/release/demo

      - name: Secret guard
        run: |
          Rscript -e "source('R/zzz_bootstrap.R'); source_project_r(); \
            stopifnot(!file.exists('.Renviron') || length(system2('git', c('check-ignore','-v','.Renviron'), stdout=TRUE))>0); \
            hits <- scan_text_for_secrets(paste(readLines('docker/runtime.env.example'), collapse='\n')); \
            stopifnot(!any(vapply(hits, function(h) identical(h\$status,'fail'), logical(1))))"

      - name: Offline test suite
        run: Rscript -e "testthat::test_dir('tests/testthat', reporter='summary')"

      - name: App source check
        run: |
          Rscript -e "Sys.setenv(GTSC_RUNTIME_PROFILE='demo', GTSC_DATA_ROOT='data/release/demo'); \
            stopifnot(file.exists('app.R')); cat('APP_SOURCE_OK\n')"

      - name: Git diff check
        run: git diff --check || true
